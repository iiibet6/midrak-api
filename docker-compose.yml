version: "3.9"

services:
  midrak:
    build: .
    container_name: midrak_api
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/uploads
      - ./outputs:/app/outputs
    environment:
      - PYTHONUNBUFFERED=1
    command: >
      uvicorn app:app
      --host 0.0.0.0
      --port 8000